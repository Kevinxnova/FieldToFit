name: Public deployment check
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: FieldToFit deployment URL
        required: true
        default: https://fieldtofit.top
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages, content and MCP
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['BASE_URL'].rstrip('/')
          parsed=urllib.parse.urlsplit(base)
          allowed={'fieldtofit.top','fieldtofit-kevinnova-projects.vercel.app'}
          assert parsed.scheme=='https' and parsed.hostname in allowed and not parsed.username and not parsed.query
          def read(path,data=None):
              headers={'User-Agent':'FieldToFit-release-check','Accept':'application/json, text/event-stream'}
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as response:return response.read()
          assert b'FieldToFit' in read('/about')
          assert b'<svg' in read('/brand/logo-horizontal-ink.svg')
          health=json.loads(read('/api/health')); assert health['version']=='v1.0.0'
          print('Health and brand assets passed',flush=True)
          objects=json.loads(read('/api/v1/platform/objects?limit=20'))
          assert objects['total']>=27
          print('Published objects:',objects['total'],flush=True)
          tools=json.loads(read('/api/mcp/curated',{'jsonrpc':'2.0','id':1,'method':'tools/list'}))['result']['tools']
          assert len(tools)==10 and all(t['name'].startswith('curated_') for t in tools)
          print('Read-only MCP tools:',len(tools))
          PY
