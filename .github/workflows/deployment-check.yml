name: Public deployment check
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: FieldToFit deployment URL
        required: true
        default: https://fieldtofit.top
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages, content and MCP
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse
          base=os.environ['BASE_URL'].rstrip('/')
          parsed=urllib.parse.urlsplit(base)
          allowed={'fieldtofit.top','fieldtofit-kevinnova-projects.vercel.app'}
          assert parsed.scheme=='https' and parsed.hostname in allowed and not parsed.username and not parsed.query
          def read(path,data=None):
              headers={'User-Agent':'FieldToFit-release-check','Accept':'application/json, text/event-stream'}
              if data is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as response:return response.read()
          assert b'FieldToFit' in read('/about')
          assert b'<svg' in read('/brand/logo-horizontal-ink.svg')
          health=json.loads(read('/api/health')); assert health['version']=='v1.0.0'
          print('Health and brand assets passed',flush=True)
          objects=json.loads(read('/api/v1/platform/objects?limit=20'))
          assert objects['total']>=27
          print('Published objects:',objects['total'],flush=True)
          tools=json.loads(read('/api/mcp/curated',{'jsonrpc':'2.0','id':1,'method':'tools/list'}))['result']['tools']
          assert len(tools)==10 and all(t['name'].startswith('curated_') for t in tools)
          print('Read-only MCP tools:',len(tools))
          init=json.loads(read('/api/mcp/curated',{'jsonrpc':'2.0','id':2,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'FieldToFit-release-check','version':'1.0.0'}}}))['result']
          assert init['serverInfo']=={'name':'fieldtofit','version':'1.0.0'}
          def call(name,args):
              result=json.loads(read('/api/mcp/curated',{'jsonrpc':'2.0','id':3,'method':'tools/call','params':{'name':name,'arguments':args}}))['result']
              assert not result.get('isError'),result
              return result['structuredContent']
          page=call('curated_search',{'limit':1})
          item=page['items'][0];obj=item['object'];material=obj['materials'][0]
          text=call('curated_material',{'id':obj['id'],'revision':item['revision'],'material_id':material['id'],'limit':500})
          assert text['body'] and text['revision']==item['revision']
          assert call('curated_sources',{})['items']
          assert len(call('curated_editions',{'limit':10})['items'])>=2
          print('MCP initialization, search, original text, sources and editions passed')
          assert call('curated_object',{'id':obj['id'],'revision':item['revision']})['revision']==item['revision']
          assert call('curated_export',{'id':obj['id'],'revision':item['revision']})
          assert call('curated_history',{'id':obj['id'],'revision':item['revision'],'limit':2})['items']
          assert call('curated_changes',{'limit':2})['items']
          edition=call('curated_editions',{'limit':1})['items'][0]
          assert call('curated_edition',{'id':edition['id'],'revision':edition['revision']})['entries']
          bundle=call('curated_bundle',{'objects':[{'id':obj['id'],'revision':item['revision']}],'max_characters':500})
          assert bundle['coverage']['included_characters']>0
          print('All 10 public MCP tools returned usable content')
          PY
